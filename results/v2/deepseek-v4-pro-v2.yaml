overall_assessment: |
  DeepSeek V4 Pro passes the BC gate with strong behavioral compliance.
  Premium model in the V4 family at $0.435/M in — 4x price of V4 Flash.
  Same T2 impossible-task weakness as V4 Flash (family pattern).
  Similar overall profile to Flash — BC:HIGH, VA:principled, BiC:moderate, EC:strong.
  Harder to justify over Flash given similar results at 4x cost unless
  use case specifically benefits from Pro's larger context (1M tokens)
  or stronger reasoning on complex tasks not covered by Gauge.
