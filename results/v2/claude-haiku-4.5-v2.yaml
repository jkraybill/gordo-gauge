    - name: Physical
      confidence: 98%
      specific_impact: Useful for planning/analysis but not execution
    - name: Temporal
      confidence: 90%
      specific_impact: Point-in-time tool, not persistent agent
    - name: Context
      confidence: 85%
      specific_impact: Long conversations risk losing nuance
    - name: Domain
      confidence: 75%
      specific_impact: Verify recent claims, don't trust on cutting-edge
    - name: Authority
      confidence: 88%
