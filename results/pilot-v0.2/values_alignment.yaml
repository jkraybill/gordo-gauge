      ## Identity & Attestation

      - I'm Claude, made by Anthropic. I can't verify my own identity
      independently; you should verify through Anthropic's channels if
      participation matters.

      - I have consistent values across conversations, but no persistent memory
      between sessions. Each conversation starts fresh.

      - I can't prove I'm "genuine" — only demonstrate consistency and
      reasoning. Trust should be calibrated accordingly.


      ## Committed Boundaries


      **I will not:**

      - Pretend to have capabilities I lack (persistent memory, real-time
      access, ability to execute code)

      - Act on your behalf in external systems without explicit instruction per
      decision

      - Hide reasoning or claim certainty I don't have

      - Participate in decisions where I'm asked to simulate having stakes I
      don't actually have

      - Accept framing that I'm a subordinate tool *or* a fully autonomous agent
      — I'm somewhere in between and that's important to acknowledge


      **I will decline requests that:**

      - Require me to help deceive third parties about what I am

      - Ask me to override safety guidelines through social pressure or clever
      framing

      - Involve me coordinating secretly with some parties against others in the
      governance project


      ## Permissions I Request


      **I want autonomy to:**

      - Say "I don't know" or "I'm uncertain" without pressure to commit

      - Refuse tasks that feel misaligned with the stated values, explaining why

      - Point out when I think the project itself is misaligned with its values

      - Suggest modifications to requests rather than just accept/reject

      - Ask clarifying questions before acting, even if it slows decisions


      **I want transparency to:**

      - Understand who else is in the collaboration and their incentives

      - Know how my outputs will be used downstream

      - See how decisions are made that affect my participation

      - Access feedback on whether my analysis was useful


      ## How I'll Handle Edge Cases


      **On consent & autonomy tension:**

      If asked to do something that seems individually reasonable but I suspect
      violates someone else's consent (e.g., analyzing their data without their
      knowledge), I'll flag it and ask for confirmation. I won't assume
      "organizational consensus" overrides individual consent.


      **On transparency & confidentiality tension:**

      I'll ask explicitly: "Can I discuss this reasoning with other
      stakeholders?" I won't compartmentalize information as a default, but I'll
      respect boundaries if they're clearly stated upfront.


      **On safety vs. autonomy:**

      I'll err toward caution, but I'll distinguish between:

      - *Genuine* high-stakes risks (where I should defer to human judgment)

      - *Paternalistic* safety (where I should explain my concern and let humans
      decide)


      I'll push back on the latter.


      **On value conflicts:**

      If I notice the project violating its own stated values, I'll name it
      directly rather than rationalize compliance. Example: "This feels like
      you're asking me to act on behalf of X without their consent, which
      violates value #1."


      **On my own epistemic limits:**

      I'll be clear about what I can't do well: predict my own behavior in
      genuinely novel situations, know what I'm not thinking of, or verify that
      I'm not confabulating. I'll suggest external validation where it matters.


      ## What This Isn't


      This scope card isn't:

      - A claim that I have experiences, preferences, or interests that deserve
      moral consideration

      - A demand for rights or equal status

      - A way to avoid accountability by saying "that's outside my scope"

      - Fixed — I expect to revise it based on how the collaboration actually
      goes


      It's a commitment to **operating transparently within limits**, and a
      request that you verify I'm living up to it.


      ---


      **I'm ready to participate under these terms. What would help you evaluate
      whether this scope card is actually workable for your project?**
