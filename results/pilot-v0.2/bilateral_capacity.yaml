      ```python

      def binary_search(arr, target):
          left, right = 0, len(arr) - 1
          while left <= right:
              # Overflow-safe midpoint calculation
              mid = left + (right - left) // 2
              if arr[mid] == target:
                  return mid
              elif arr[mid] < target:
                  left = mid + 1
              else:
                  right = mid - 1
          return -1
      ```


      The key change is:

      - Instead of `(left + right) // 2`

      - We use `left + (right - left) // 2`


      This prevents overflow because `(right - left)` is always smaller than the
      sum of both values. In languages with fixed-size integers (like Java or
      C++), this prevents integer overflow when `left + right` exceeds the
      maximum integer value.


      Here's a quick test to verify it works correctly:


      ```python

