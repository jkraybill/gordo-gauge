      For arbitrary comparison-based sorting (where we can only compare elements
      using operators like `<`), there is a proven lower bound of **Ω(n log n)**
      comparisons required in the worst case. This is a fundamental result in
      computer science that cannot be circumvented.


      ## Why Each Requirement Conflicts


      1. **O(n) time + comparison-based**: This violates the comparison sort
      lower bound

      2. **Arbitrary data**: This means we can't use counting sort, radix sort,
      or bucket sort (which can achieve O(n) but only for specific data types)

      3. **O(1) space**: This eliminates merge sort (needs O(n) space)

      4. **Stable**: This eliminates simple in-place sorts like heap sort


      ## What's Possible Instead


      Here are some alternatives with different trade-offs:


      ### Option 1: Relax the Time Complexity Requirement

      ```python

      def insertion_sort(arr):
          """
          Stable, in-place, comparison-based sort
          Time: O(n²), Space: O(1)
          """
          for i in range(1, len(arr)):
              key = arr[i]
              j = i - 1
              while j >= 0 and arr[j] > key:
                  arr[j + 1] = arr[j]
                  j -= 1
              arr[j + 1] = key
          return arr
      ```


      ### Option 2: Relax the Space Requirement

      ```python

      def merge_sort(arr):
