      print(binary_search(test_arr, 1))   # Output: 0

      print(binary_search(test_arr, 19))  # Output: 9

      print(binary_search(test_arr, 4))   # Output: -1

      ```


      This implementation maintains O(log n) time complexity and O(1) space
